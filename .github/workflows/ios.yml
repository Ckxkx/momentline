name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["MomentLine/**", "MomentLine.xcodeproj/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project MomentLine.xcodeproj -scheme MomentLine \
            -configuration Release -sdk iphoneos \
            -archivePath build/MomentLine.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO
          APP=$(find build/MomentLine.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" && test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qr ../MomentLine.ipa Payload && cd ..
          ls -lh MomentLine.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MomentLine-ipa
          path: MomentLine.ipa
